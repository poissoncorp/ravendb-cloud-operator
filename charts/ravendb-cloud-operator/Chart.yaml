apiVersion: v2
name: ravendb-cloud-operator
description: Manage RavenDB Cloud clusters as Kubernetes objects
type: application

# version is the packaging, appVersion is the operator. They move
# independently so a values-only change can ship without implying a new
# operator. Both are overwritten at release time from the git tag.
version: 0.0.0-dev
appVersion: 0.0.0-dev

kubeVersion: ">=1.29.0-0"
home: https://github.com/ravendb/ravendb-cloud-operator
sources:
  - https://github.com/ravendb/ravendb-cloud-operator
keywords: [ravendb, database, cloud, operator]
annotations:
  # Level 1, Basic Install. The higher levels are about the database itself,
  # its upgrades, backups and metrics, which the RavenDB Cloud public API does
  # not reach.
  operatorframework.io/capability-level: "Basic Install"
