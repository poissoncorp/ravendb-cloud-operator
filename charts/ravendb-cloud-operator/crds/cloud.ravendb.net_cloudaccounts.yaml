---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudaccounts.cloud.ravendb.net
spec:
  group: cloud.ravendb.net
  names:
    categories:
    - ravendb
    kind: CloudAccount
    listKind: CloudAccountList
    plural: cloudaccounts
    shortNames:
    - rca
    - rcaccount
    singular: cloudaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Status
      type: string
    - jsonPath: .status.domainName
      name: Domain
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.defaultReleaseChannel
      name: Default-Channel
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudAccount is a verified credential for a RavenDB Cloud account, plus the
          defaults its clusters inherit. Every CloudCluster references exactly one.

          Deleting a CloudAccount waits while any CloudCluster in the namespace still
          references it, and the Ready condition, with reason InUse, names them.
          Without the credential those clusters could not be reconciled, and one with
          deletionPolicy Terminate could not terminate its cluster either, so its own
          deletion would never finish. Delete the clusters first.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CloudAccountSpec is the credential and the shared defaults for one RavenDB
              Cloud account.
            properties:
              apiKeySecretRef:
                description: |-
                  APIKeySecretRef points at the Secret holding the RavenDB Cloud API key.
                  The operator watches the Secret, so a new key takes effect as soon as it
                  is written there. The key is never written to status, events or logs.
                properties:
                  key:
                    default: apiKey
                    description: Key inside the Secret holding the value. Defaults
                      to apiKey.
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              defaults:
                description: Defaults are inherited by CloudClusters that reference
                  this account.
                properties:
                  allowedIPs:
                    description: |-
                      AllowedIPs used when a CloudCluster does not list any. RavenDB Cloud
                      requires at least one allow-list entry to create a cluster.

                      The same rules apply as to spec.networking.allowedIPs on a CloudCluster:
                      every entry is in CIDR notation, so a single address needs a prefix
                      (203.0.113.7/32, not 203.0.113.7), order carries no meaning, and
                      duplicates are refused.
                    items:
                      format: cidr
                      type: string
                    maxItems: 200
                    type: array
                    x-kubernetes-list-type: set
                  provider:
                    description: Provider used when a CloudCluster does not name one.
                    enum:
                    - AWS
                    - Azure
                    - GCP
                    type: string
                  region:
                    description: Region used when a CloudCluster does not name one.
                    type: string
                  releaseChannel:
                    description: |-
                      ReleaseChannel used when a CloudCluster does not name one. When this is
                      empty too, the operator falls back to the account default reported by
                      RavenDB Cloud.
                    type: string
                type: object
              refreshIntervalSeconds:
                default: 3600
                description: |-
                  RefreshIntervalSeconds is how often, in seconds, the operator re-reads
                  the region and release channel lists held in status.providers and
                  status.releaseChannels. Defaults to 3600, one hour, because the lists
                  rarely change.

                  Instance types and disk offers are not covered. They are never cached,
                  and are read fresh whenever the operator creates a cluster.
                format: int32
                minimum: 60
                type: integer
            required:
            - apiKeySecretRef
            type: object
          status:
            description: |-
              CloudAccountStatus reports credential health and what this account may order.

              The regions and release channels are listed here, so kubectl describe
              cloudaccount answers what a CloudCluster using this account can ask for.
              Instance types and disk offers are not: the operator reads them from RavenDB
              Cloud when it creates a cluster, and names the ones on offer if a manifest
              asks for one that is not.
            properties:
              conditions:
                description: |-
                  Conditions hold Ready, whose reason is the STATUS column:

                    Verified            RavenDB Cloud accepted the API key
                    KeyMissing          the Secret or the key in it is not there yet
                    KeyRejected         RavenDB Cloud does not accept the key; put a new one in the Secret
                    CloudUnreachable    Unknown: RavenDB Cloud did not answer; retried with backoff
                    UnexpectedResponse  Unknown: RavenDB Cloud answered in a way this operator cannot read
                    InUse               the account is being deleted and CloudClusters still use it;
                                        Ready keeps the status of the last verification
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              defaultReleaseChannel:
                description: DefaultReleaseChannel is what RavenDB Cloud picks when
                  none is named.
                type: string
              domainName:
                description: DomainName is the DNS domain RavenDB Cloud assigned to
                  this account.
                type: string
              lastVerifiedTime:
                description: LastVerifiedTime is when the credential was last confirmed
                  to work.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              providers:
                description: Providers lists the regions available, per cloud provider.
                items:
                  description: ProviderRegions is the set of regions available for
                    one provider.
                  properties:
                    provider:
                      description: Provider these regions belong to.
                      enum:
                      - AWS
                      - Azure
                      - GCP
                      type: string
                    regions:
                      description: Regions available to this account.
                      items:
                        type: string
                      type: array
                  required:
                  - provider
                  type: object
                type: array
              refreshedAt:
                description: |-
                  RefreshedAt is when the region and release channel lists were last read
                  from RavenDB Cloud. They are re-read every spec.refreshIntervalSeconds.
                format: date-time
                type: string
              releaseChannels:
                description: ReleaseChannels lists the RavenDB version streams available.
                items:
                  description: ReleaseChannelStatus is one RavenDB version stream
                    offered to this account.
                  properties:
                    buildType:
                      description: BuildType is Stable or Development.
                      type: string
                    name:
                      description: Name of the channel, as used in CloudCluster spec.releaseChannel.
                      type: string
                    ravenVersion:
                      description: RavenVersion currently served by the channel.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
