# The credential the labs share. labs/00_setup.sh points the operator itself
# at the simulator, so the account is the one you would write for real, with a
# key the simulator accepts.
apiVersion: v1
kind: Secret
metadata:
  name: ravendb-cloud-api-key
  namespace: apps
type: Opaque
stringData:
  # Matches --api-key on the simulator. In production this is an API key you
  # create in the RavenDB Cloud portal under Account -> API Keys.
  apiKey: lab-api-key
---
apiVersion: cloud.ravendb.net/v1alpha1
kind: CloudAccount
metadata:
  name: ravendb-cloud
  namespace: apps
spec:
  apiKeySecretRef:
    name: ravendb-cloud-api-key
    key: apiKey


  defaults:
    provider: AWS
    region: eu-central-1
    # Inert against the simulator, which has no firewall to configure. The
    # cloud target does not inherit this: see LAB_ALLOWED_IPS in labs/lib.sh.
    allowedIPs:
      - 0.0.0.0/0

  # Faster than the one hour default, so a lab that rotates a key or watches
  # the lists does not wait an hour to see the effect.
  refreshIntervalSeconds: 120
