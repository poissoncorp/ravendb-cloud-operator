name: Lint workflows

# A mistake in a workflow otherwise shows up only when it runs, and the release
# workflows run once per release. actionlint checks expressions, job and step
# references, permissions and, with the runner's shellcheck, every run block.
on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # go run at a pinned version, so the download is checked against the Go
      # checksum database rather than piped from a script on a branch.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
