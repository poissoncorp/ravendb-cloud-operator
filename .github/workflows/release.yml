name: Release

# Tags publish; nothing else does. A branch push must never move a tag someone
# has already deployed, and `latest` is deliberately not what any manifest
# references: an operator pinned to it reinstalls something different on every
# pod restart, which for a process holding an API key and a finalizer is worse
# than for a stateless service.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for a manual re-run"
        required: true

# Read-only by default. Each job that publishes asks for exactly what it
# publishes, so a step in verify never holds a token that can push or sign.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

  # What every job checks out. A workflow_dispatch run starts from whatever ref
  # the UI offered, which is the default branch, so without this the tag typed
  # into the input would only reach the version string and a manual re-run of
  # v0.1.0 would publish the head of main under that tag.
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

  # Every Makefile target shells out to hack/go.sh by default, which runs the
  # toolchain in a container. A runner has Go, so the container would be pure
  # overhead. Same reason ci.yml sets it.
  GO_LOCAL: "1"

jobs:
  # Everything that can say no, before anything is published. A registry push
  # cannot be taken back, so a check that runs after the image job would leave
  # the image and the `latest` tag live with no chart to install them with.
  verify:
    name: the chart matches config/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # The chart consumes the generated CRDs and RBAC rather than restating
      # them. If that copy is stale the chart would install an operator whose
      # permissions do not match its markers. Renders every values file in
      # ci/ as well, because the defaults reach none of the optional branches.
      - name: chart is in sync, lints and renders
        run: make chart-lint

  image:
    name: build and push the image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      # Both are for the build provenance attestation below: id-token to get a
      # Sigstore certificate, attestations to record the result against the repo.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}

      # Both outputs come from one place so the tag that is built and the tag
      # that is published can never disagree.
      - id: version
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          version="${v#v}"
          tags="${IMAGE}:${version}"
          # A prerelease must not move latest. Anything with a hyphen after the
          # version is one, by semver, and handing every unpinned install a
          # release candidate is not what pushing v1.0.0-rc1 means.
          case "$version" in
            *-*) echo "prerelease ${version}: latest stays where it is" ;;
            *)   tags="${tags},${IMAGE}:latest" ;;
          esac
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"
          echo "building ${version} as ${tags}"

      # The Dockerfile already takes TARGETOS and TARGETARCH, so both
      # architectures come out of one build with no Dockerfile change.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Decided in the version step. Only the immutable tag belongs in a
          # manifest; latest is a convenience and is absent for a prerelease.
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # What the image is made of, and how it was made, published beside it
          # rather than reconstructed later from a tag that may have moved.
          sbom: true
          provenance: mode=max

      # The attestation is the half the registry cannot forge: a Sigstore
      # signature tying this digest to this workflow run and this commit, which
      # `gh attestation verify` checks without trusting ghcr.io.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Publishing only. verify already established that this chart matches the
  # markers, so this job needs helm and nothing else.
  chart:
    name: package the Helm chart
    runs-on: ubuntu-latest
    needs: [verify, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: package
        run: |
          helm package charts/ravendb-cloud-operator \
            --version "${{ needs.image.outputs.version }}" \
            --app-version "${{ needs.image.outputs.version }}"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push as an OCI artifact
        run: |
          helm push ravendb-cloud-operator-*.tgz \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

  # The kubectl plugin runs on a laptop, so it ships as plain binaries
  # attached to a GitHub release. The image carries a copy too, for running it
  # inside the cluster next to the key; see the Dockerfile. The attestation is the same guarantee the image gets: these bytes came from
  # this workflow run and this commit.
  export-tool:
    name: build the kubectl plugin
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/kubectl-ravendb_cloud-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/kubectl-ravendb_cloud
          done
          (cd dist && sha256sum kubectl-ravendb_cloud-* > SHA256SUMS)

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/kubectl-ravendb_cloud-*

      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A prerelease tag makes a prerelease, for the same reason the image
          # job keeps latest where it is.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag $prerelease --title "$TAG" --notes ""
          gh release upload "$TAG" dist/* --clobber
