name: Release

# The second half of releasing, after Prepare Release. Merging its pull request
# with the release:auto label still on publishes the VERSION in the Makefile.
# Everything that can say no runs first: the tests, a smoke install of
# install.yaml on kind, and the arm64 image starting under QEMU. Only then is
# anything published, because a pushed image cannot be taken back: the image
# on Docker Hub, the tag, and a GitHub Release with install.yaml and the
# kubectl plugin. The Helm chart needs no step here: the merged pull request
# put it in helm/, which GitHub Pages serves.
#
# Run it by hand (workflow_dispatch) to publish main's VERSION when a run
# failed after the pull request was merged.
#
# Secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  a Docker Hub token that can push
#                                        ravendb/ravendb-cloud-operator
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two releases at once would race for the tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: docker.io/ravendb/ravendb-cloud-operator
  # The Makefile runs Go through a container by default; a runner has Go.
  GO_LOCAL: "1"

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release:auto'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      # For the provenance attestations: a Sigstore certificate, and the record
      # of it against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit for a merged pull request, the branch head for a
          # manual run.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # One place decides the version and the tags, so what is built and what
      # is published cannot disagree.
      - name: version
        id: version
        run: |
          version="$(sed -n 's/^VERSION ?= *//p' Makefile)"
          case "$version" in
            ''|*-dev)
              echo "::error::Makefile VERSION is '${version}': run Prepare Release first"
              exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} is already released"
            exit 1
          fi
          tags="${IMAGE}:${version}"
          prerelease=false
          # A prerelease must not move latest: handing every unpinned install a
          # release candidate is not what releasing 1.0.0-rc.1 means.
          case "$version" in
            *-*) prerelease=true ;;
            *)   tags="${tags},${IMAGE}:latest" ;;
          esac
          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${version} as ${tags}"

      # Half a minute to find an expired or read-only token, rather than after
      # the smoke test.
      - name: the publishing credentials work
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker logout
          scope="$(curl -fsS -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ravendb/ravendb-cloud-operator:push,pull" |
            python3 -c '
          import base64, json, sys
          token = json.load(sys.stdin)["token"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(token + "=" * (-len(token) % 4)))
          print(",".join(sorted({a for e in claims.get("access", []) for a in e.get("actions", [])})))')"
          if [[ ",${scope}," != *,push,* ]]; then
            echo "::error::DOCKERHUB_TOKEN cannot push ravendb/ravendb-cloud-operator (granted: ${scope:-nothing})"
            exit 1
          fi
          gh release list --limit 1 >/dev/null

      - name: tests
        run: make test

      - name: the chart matches config/ and lints
        run: make chart-lint

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: build the image for the smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build install.yaml
        run: make build-installer RELEASE_IMG="${IMAGE}:${{ steps.version.outputs.version }}"

      - name: create a kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: smoke
          version: v0.27.0

      - name: smoke test install.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          kind load docker-image "${IMAGE}:${VERSION}" --name smoke
          kubectl apply -f dist/install.yaml
          kubectl -n ravendb-cloud-operator-system rollout status \
            deployment/ravendb-cloud-operator-controller-manager --timeout=3m

      - name: smoke test diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n ravendb-cloud-operator-system describe deployment || true
          kubectl -n ravendb-cloud-operator-system logs deployment/ravendb-cloud-operator-controller-manager --tail=100 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true

      # A cross-built binary for the wrong architecture would only fail on the
      # first arm64 node that pulls it.
      - name: build the arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          load: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-arm64-smoke
          cache-from: type=gha

      - name: the arm64 image starts and knows its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          got="$(docker run --rm --platform linux/arm64 "${IMAGE}:${VERSION}-arm64-smoke" --version)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the arm64 manager printed '${got}', want '${VERSION}'"
            exit 1
          fi

      # Publishing. Nothing above this line left anything behind.

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push the image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          # What the image is made of, and how it was made, published beside it.
          sbom: true
          provenance: mode=max

      # The half a registry cannot forge: a Sigstore signature tying this digest
      # to this run and this commit, which `gh attestation verify` checks.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: both architectures were pushed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          platforms="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '/Platform:/ {print $2}')"
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" <<<"$platforms" || { echo "::error::${want} is missing"; exit 1; }
          done

      # The plugin runs on a laptop, so it ships as plain binaries. The image
      # carries a copy too, for running it in the cluster next to the key.
      - name: build the kubectl plugin
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ldflags="-s -w -X github.com/ravendb/ravendb-cloud-operator/internal/version.Version=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/kubectl-ravendb_cloud-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$ldflags" -o "$out" ./cmd/kubectl-ravendb_cloud
          done
          (cd dist && sha256sum install.yaml kubectl-ravendb_cloud-* > SHA256SUMS)

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/install.yaml
            dist/kubectl-ravendb_cloud-*

      - name: tag and publish the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          flags=()
          [ "$PRERELEASE" = true ] && flags=(--prerelease)
          gh release create "v${VERSION}" "${flags[@]}" --verify-tag --title "v${VERSION}" --generate-notes \
            dist/install.yaml dist/kubectl-ravendb_cloud-* dist/SHA256SUMS
          echo "url=$(gh release view "v${VERSION}" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "## Released v${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}:${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Helm | \`helm install ravendb-cloud-operator ravendb-cloud-operator/ravendb-cloud-operator --version ${VERSION}\` |"
            echo "| GitHub Release | ${RELEASE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
