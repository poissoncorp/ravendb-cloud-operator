name: Cloud drift

# Has RavenDB Cloud's published OpenAPI document moved away from
# .reference/swagger.json, the copy the client and the simulator were last
# checked against? A move opens an issue, once: a failed scheduled run alone
# notifies only whoever last edited this file.
#
# GitHub disables a schedule after 60 days without activity in the
# repository; the run page offers to enable it again.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: compare
        id: compare
        run: |
          rc=0
          go run ./hack/cloud-drift > drift.txt || rc=$?
          cat drift.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -ne 2 ]

      - name: open an issue
        if: steps.compare.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: RavenDB Cloud's OpenAPI document moved
        run: |
          if [ -n "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')" ]; then
            echo "an issue is already open"
            exit 0
          fi
          {
            echo "The weekly check found the published OpenAPI document differs from \`.reference/swagger.json\`:"
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo
            echo "Read the change, bring \`internal/cloudapi\` and \`internal/cloudsim\` in line, then update the copy."
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
